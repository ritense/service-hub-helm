imageRegistry: "ghcr.io/ritense"

backend:
  image:
    repository: "service-hub-backend"
    tag: "" # Defaults to Chart.appVersion when empty
  imagePullSecrets: [] # Example: [{name: my-registry-secret}]
  replicas: 1
  containerPort: 8080
  servicePort: 8080
  jwksUri: "REPLACE_ME"
  datasource:
    url: "REPLACE_ME"
    username: "REPLACE_ME"
    passwordSecret:
      name: "service-hub"
      key: "SPRING_DATASOURCE_PASSWORD"
  keycloak:
    adminServerUrl: "REPLACE_ME"
    adminRealm: "service-hub-admin"
    adminClientId: "service-hub-admin-m2m-client"
    adminClientSecretSecret:
      name: "service-hub"
      key: "KEYCLOAK_ADMIN_CLIENT_SECRET"
  s3:
    endpoint: "REPLACE_ME"
    logoBucket: "service-hub-logos"
    accessKeySecret:
      name: "service-hub"
      key: "S3_ACCESS_KEY"
    secretKeySecret:
      name: "service-hub"
      key: "S3_SECRET_KEY"
  baseUrl: "http://localhost:3000"
  slack:
    enabled: false
    webhookUrl: ""
    reminderCron: "0 0 9 * * MON-FRI"

frontend:
  image:
    repository: "service-hub-frontend"
    tag: "" # Defaults to Chart.appVersion when empty
  imagePullSecrets: [] # Example: [{name: my-registry-secret}]
  replicas: 1
  containerPort: 8081
  servicePort: 8081
  keycloak:
    url: "REPLACE_ME"
    realm: "valtimo"
    clientId: "service-hub"
  exchangeUrl: "REPLACE_ME"

ingress:
  enabled: true
  ingressClassName: "" # Set to e.g. "nginx" to bind to a specific ingress controller
  host: "REPLACE_ME"
  annotations:
    ingress.kubernetes.io/custom-request-headers: "X-Forwarded-Proto: https"
  tls:
    enabled: false
    secretName: ""
