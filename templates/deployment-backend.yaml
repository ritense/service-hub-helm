apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-backend
  labels:
    app: {{ .Release.Name }}-backend
spec:
  replicas: {{ .Values.backend.replicas }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}-backend
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-backend
    spec:
      {{- with .Values.backend.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: backend
          image: "{{ printf "%s/%s:%s" .Values.imageRegistry .Values.backend.image.repository (default .Chart.AppVersion .Values.backend.image.tag) }}"
          ports:
            - containerPort: {{ .Values.backend.containerPort }}
          env:
            - name: JWKS_URI
              valueFrom:
                configMapKeyRef:
                  name: {{ .Release.Name }}
                  key: JWKS_URI
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ .Release.Name }}
                  key: SPRING_DATASOURCE_URL
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: {{ .Release.Name }}
                  key: SPRING_DATASOURCE_USERNAME
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.backend.datasource.passwordSecret.name }}
                  key: {{ .Values.backend.datasource.passwordSecret.key }}
            - name: KEYCLOAK_ADMIN_SERVER_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ .Release.Name }}
                  key: KEYCLOAK_ADMIN_SERVER_URL
            - name: KEYCLOAK_ADMIN_REALM
              valueFrom:
                configMapKeyRef:
                  name: {{ .Release.Name }}
                  key: KEYCLOAK_ADMIN_REALM
            - name: KEYCLOAK_ADMIN_CLIENT_ID
              valueFrom:
                configMapKeyRef:
                  name: {{ .Release.Name }}
                  key: KEYCLOAK_ADMIN_CLIENT_ID
            - name: KEYCLOAK_ADMIN_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.backend.keycloak.adminClientSecretSecret.name }}
                  key: {{ .Values.backend.keycloak.adminClientSecretSecret.key }}
            - name: S3_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: {{ .Release.Name }}
                  key: S3_ENDPOINT
            - name: S3_LOGO_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: {{ .Release.Name }}
                  key: S3_LOGO_BUCKET
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.backend.s3.accessKeySecret.name }}
                  key: {{ .Values.backend.s3.accessKeySecret.key }}
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.backend.s3.secretKeySecret.name }}
                  key: {{ .Values.backend.s3.secretKeySecret.key }}
            - name: SLACK_NOTIFICATIONS_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: {{ .Release.Name }}
                  key: SLACK_NOTIFICATIONS_ENABLED
            - name: SLACK_WEBHOOK_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ .Release.Name }}
                  key: SLACK_WEBHOOK_URL
            - name: SLACK_REMINDER_CRON
              valueFrom:
                configMapKeyRef:
                  name: {{ .Release.Name }}
                  key: SLACK_REMINDER_CRON
            - name: SERVICEHUB_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ .Release.Name }}
                  key: SERVICEHUB_BASE_URL
