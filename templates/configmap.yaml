apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}
  labels:
    app: {{ .Release.Name }}
data:
  JWKS_URI: "{{ .Values.backend.jwksUri }}"
  SPRING_DATASOURCE_URL: "{{ .Values.backend.datasource.url }}"
  SPRING_DATASOURCE_USERNAME: "{{ .Values.backend.datasource.username }}"
  KEYCLOAK_ADMIN_SERVER_URL: "{{ .Values.backend.keycloak.adminServerUrl }}"
  KEYCLOAK_ADMIN_REALM: "{{ .Values.backend.keycloak.adminRealm }}"
  KEYCLOAK_ADMIN_CLIENT_ID: "{{ .Values.backend.keycloak.adminClientId }}"
  S3_ENDPOINT: "{{ .Values.backend.s3.endpoint }}"
  S3_LOGO_BUCKET: "{{ .Values.backend.s3.logoBucket }}"
  KEYCLOAK_URL: "{{ .Values.frontend.keycloak.url }}"
  KEYCLOAK_REALM: "{{ .Values.frontend.keycloak.realm }}"
  KEYCLOAK_CLIENT_ID: "{{ .Values.frontend.keycloak.clientId }}"
