apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-frontend
  labels:
    app: {{ .Release.Name }}-frontend
spec:
  replicas: {{ .Values.frontend.replicas }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}-frontend
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-frontend
    spec:
      {{- with .Values.frontend.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: frontend
          image: "{{ printf "%s/%s:%s" .Values.imageRegistry .Values.frontend.image.repository (default .Chart.AppVersion .Values.frontend.image.tag) }}"
          ports:
            - containerPort: {{ .Values.frontend.containerPort }}
          env:
            - name: BACKEND_HOST
              value: "{{ .Release.Name }}-backend"
            - name: BACKEND_PORT
              value: "{{ .Values.backend.servicePort }}"
            - name: KEYCLOAK_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ .Release.Name }}
                  key: KEYCLOAK_URL
            - name: KEYCLOAK_REALM
              valueFrom:
                configMapKeyRef:
                  name: {{ .Release.Name }}
                  key: KEYCLOAK_REALM
            - name: KEYCLOAK_CLIENT_ID
              valueFrom:
                configMapKeyRef:
                  name: {{ .Release.Name }}
                  key: KEYCLOAK_CLIENT_ID
            - name: EXCHANGE_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ .Release.Name }}
                  key: EXCHANGE_URL
